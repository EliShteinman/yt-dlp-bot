[project]
name = "app_worker"
version = "0.1.0"
requires-python = ">=3.14"
description = "Download worker that runs yt-dlp and ffmpeg jobs from RabbitMQ"
dependencies = [
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "yt-dlp>=2024.5.23.232707.dev0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: hits real external services such as YouTube"]
