[project]
name = "app_bot"
version = "0.1.0"
requires-python = ">=3.14"
description = "Telegram bot that accepts media links and uploads the downloaded files"
dependencies = [
    "kurigram>=2.2.26",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
    "tgcrypto-pyrofork>=1.2.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
